name: Strava sync
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync_strava.py
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
      - name: Commit wijzigingen
        run: |
          git config user.name "strava-sync"
          git config user.email "actions@users.noreply.github.com"
          git add js/strava-data.js
          git diff --cached --quiet || (git commit -m "Strava-data bijgewerkt" && git push)
