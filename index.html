<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rob op reis</title>
  <meta name="description" content="Reisinspiratie per land, van plaatsen waar we echt geweest zijn.">
  <link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <a class="logo" href="#/">Rob op reis</a>
      <nav aria-label="Hoofdmenu">
        <a href="#/kaart">Kaart</a>
        <a href="#/landen">Landen</a>
      </nav>
    </div>
  </header>

  <main id="home">
    <section class="hero" id="hero"></section>
    <section class="wrap map-wrap" id="kaart">
      <div class="block-head">
        <h2>Op de kaart</h2>
        <p>Klik op een land om de reis te lezen. Donker gekleurde landen hebben een pagina, lichte volgen nog.</p>
      </div>
      <div id="map" role="region" aria-label="Wereldkaart met bezochte landen"></div>
    </section>
    <section class="wrap" id="landen">
      <div class="block-head"><h2>Alle landen</h2></div>
      <div class="grid" id="grid"></div>
      <div class="soon-list" id="soon"></div>
    </section>
  </main>

  <article id="country" hidden></article>

  <footer>
    <div class="wrap">
      <span class="logo">Rob op reis</span>
      Reisinspiratie van plaatsen waar we zelf verbleven. Landgrenzen: Natural Earth.
    </div>
  </footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/world.js"></script>
  <script src="js/countries.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
