<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Mustache</title>
  <meta name="description" content="Travel Mustache: reisinspiratie per land, van plaatsen waar Rob en Joke zelf verbleven.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="snor" viewBox="0 8 120 32"><path fill="currentColor" d="M60 27C58 14 44 8 31 15C23 19 19 28 12 29C4 30 1 20 7 15C13 10 22 13 21 20C20 25 14 25 13 21C12 27 17 32 25 31C33 30 39 37 50 36C56 35 59 32 60 27Z"/><path fill="currentColor" transform="translate(120 0) scale(-1 1)" d="M60 27C58 14 44 8 31 15C23 19 19 28 12 29C4 30 1 20 7 15C13 10 22 13 21 20C20 25 14 25 13 21C12 27 17 32 25 31C33 30 39 37 50 36C56 35 59 32 60 27Z"/></symbol></svg>
    <header class="site-head">
    <div class="wrap">
      <a class="logo" href="#/"><svg class="mark" aria-hidden="true"><use href="#snor"/></svg>Travel Mustache</a>
      <nav aria-label="Hoofdmenu">
        <a href="#/kaart">Kaart</a>
        <a href="#/landen">Landen</a>
      </nav>
    </div>
  </header>

  <main id="home">
    <section class="hero" id="hero"></section>
    <section class="wrap map-wrap" id="kaart">
      <div class="block-head">
        <h2>Op de kaart</h2>
        <p>Klik op een land om de reis te lezen. Donker gekleurde landen hebben een pagina, lichte volgen nog.</p>
      </div>
      <div id="map" role="region" aria-label="Wereldkaart met bezochte landen"></div>
    </section>
    <section class="wrap" id="landen">
      <div class="block-head"><h2>Alle landen</h2></div>
      <div class="grid" id="grid"></div>
      <div class="soon-list" id="soon"></div>
    </section>
  </main>

  <article id="country" hidden></article>

  <footer>
    <div class="wrap">
      <span class="logo"><svg class="mark" aria-hidden="true"><use href="#snor"/></svg>Travel Mustache</span>
      Reisinspiratie van plaatsen waar we zelf verbleven. Landgrenzen: Natural Earth.
    </div>
  </footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/world.js"></script>
  <script src="js/countries.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
